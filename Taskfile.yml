version: '3'

tasks:
  test:
    desc: Run all module tests
    cmds:
      - go test ./...

  build:
    desc: Build the CLI
    cmds:
      - go build -o bin/codeindex ./cmd/codeindex

  parity:
    desc: Byte-compare an extraction against the goldens (pass repo paths after --)
    cmds:
      - go run ./cmd/codeindex index --golden-dir testdata/parity {{.CLI_ARGS}}

  proto:
    desc: update from bsr
    cmds:
      - go get buf.build/gen/go/tldiagramcom/diagram/protocolbuffers/go@$(buf registry sdk version --module=buf.build/tldiagramcom/diagram --plugin=buf.build/protocolbuffers/go)
